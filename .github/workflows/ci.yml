name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Manual Checkout
        run: |
          git init
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD


      - name: Setup Rust Environment
        run: |
          rustup toolchain install stable
          rustup default stable

      - name: Build Daemon and Static Library
        run: |
          echo "[Build] Compiling tau-gate..."
          cargo build --release
          
      - name: Verify Build Outputs
        run: |
          if [ ! -f target/release/tau-gate ]; then
            echo "Error: Daemon binary not found!"
            exit 1
          fi
          if [ ! -f target/release/libtau_gate.a ]; then
            echo "Error: Static library libtau_gate.a not found!"
            exit 1
          fi
          echo "✅ Build verified."

      - name: Run Tests
        run: cargo test --release
