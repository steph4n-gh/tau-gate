name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.85.0
    steps:
      - name: Manual Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD


      - name: Setup Rust Environment
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy
          rustup toolchain install 1.88.0 --profile minimal

      - name: Build CLI and Native Library
        run: |
          echo "[Build] Compiling tau-gate..."
          cargo build --release --offline
          
      - name: Verify Build Outputs
        run: |
          if [ ! -f target/release/tau-gate ]; then
            echo "Error: CLI binary not found!"
            exit 1
          fi
          if [ ! -f target/release/libtau_gate.a ]; then
            echo "Error: Static library libtau_gate.a not found!"
            exit 1
          fi
          echo "✅ Build verified."

      - name: Run Tests
        run: cargo test --release --offline --all-targets

      - name: Verify exact Git PR capture
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_pr_review.py' -v

      - name: Verify qualification helpers
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p 'test_qualification*.py' -v

      - name: Check differential harness seeds
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 fuzz/seeds.py
          cargo test --manifest-path fuzz/Cargo.toml --lib --locked

      - name: Check formatting and read-only review
        run: |
          cargo fmt -- --check
          cargo clippy --offline --all-targets -- -D warnings
          ./e2e_zero.sh
          cc -Iinclude tests/ffi_smoke.c target/release/libtau_gate.a -ldl -lpthread -lm -o /tmp/tau-ffi-smoke
          /tmp/tau-ffi-smoke
