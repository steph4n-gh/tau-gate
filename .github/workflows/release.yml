name: Reproducible Linux release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-attest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Build twice in isolated pinned containers
        id: build
        shell: bash
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          for label in a b; do
            source="$RUNNER_TEMP/source-$label"
            output="$RUNNER_TEMP/build-$label"
            git clone --quiet --no-local "$GITHUB_WORKSPACE" "$source"
            git -C "$source" checkout --quiet --detach "$SOURCE_COMMIT"
            mkdir "$output"
            docker run --rm --platform linux/amd64 --network none \
              --cpus 2 --memory 2g --pids-limit 256 --cap-drop ALL \
              --security-opt no-new-privileges \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$source,dst=/source-$label,readonly" \
              --mount "type=bind,src=$output,dst=/output-$label" \
              --workdir "/source-$label" \
              --env HOME=/tmp \
              --env CARGO_HOME=/tmp/cargo \
              --env "TAU_GATE_SOURCE_COMMIT=$SOURCE_COMMIT" \
              --env "CARGO_TARGET_DIR=/output-$label/target" \
              --env "RELEASE_OUTPUT_DIR=/output-$label/release" \
              --env GIT_CONFIG_COUNT=1 \
              --env GIT_CONFIG_KEY_0=safe.directory \
              --env "GIT_CONFIG_VALUE_0=/source-$label" \
              rust@sha256:16a7f242108de02f10fe4a392991679bafa7694e59f5b40a54d5af1be9b40d03 \
              sh tools/release/build.sh
          done
          cmp "$RUNNER_TEMP/build-a/release/dist/SHA256SUMS" "$RUNNER_TEMP/build-b/release/dist/SHA256SUMS"
          for file in "$RUNNER_TEMP/build-a/release/dist/"*; do
            cmp "$file" "$RUNNER_TEMP/build-b/release/dist/$(basename "$file")"
          done
          cmp "$RUNNER_TEMP/build-a/release/stage/tau-gate" "$RUNNER_TEMP/build-b/release/stage/tau-gate"
          archive=$(find "$RUNNER_TEMP/build-a/release/dist" -maxdepth 1 -name 'tau-gate-v*-linux-x86_64.tar.gz' -type f)
          test -n "$archive"
          test "$(printf '%s\n' "$archive" | wc -l)" -eq 1
          {
            echo "archive=$archive"
            echo "sbom=${archive%.tar.gz}.cdx.json"
            echo "dist=$RUNNER_TEMP/build-a/release/dist"
          } >> "$GITHUB_OUTPUT"

      - name: Install on a clean Debian 12 runtime
        shell: bash
        env:
          ARCHIVE: ${{ steps.build.outputs.archive }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 --network none \
            --read-only --tmpfs /tmp:rw,exec,nosuid,size=64m --cap-drop ALL \
            --security-opt no-new-privileges \
            --mount "type=bind,src=$ARCHIVE,dst=/input/release.tar.gz,readonly" \
            debian@sha256:7c7b2c966bc9ee8cedfeef67e0e279108992c77681fa595db4a9d65c06ccc587 \
            sh -ceu 'mkdir /tmp/tau-gate; tar -xzf /input/release.tar.gz -C /tmp/tau-gate; /tmp/tau-gate/tau-gate --verify'

      - name: Sign build provenance
        id: provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            ${{ steps.build.outputs.archive }}
            ${{ steps.build.outputs.sbom }}

      - name: Sign the SBOM assertion
        id: sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: ${{ steps.build.outputs.archive }}
          sbom-path: ${{ steps.build.outputs.sbom }}

      - name: Preserve candidate and offline signature bundles
        env:
          DIST: ${{ steps.build.outputs.dist }}
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        shell: bash
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE" "$DIST/provenance.sigstore.json"
          cp "$SBOM_BUNDLE" "$DIST/sbom.sigstore.json"
          (cd "$DIST" && sha256sum --check SHA256SUMS)

      - name: Upload the qualified candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tau-gate-linux-x86_64
          path: ${{ steps.build.outputs.dist }}/*
          if-no-files-found: error
