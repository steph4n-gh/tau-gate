name: Release & Dogfood

on:
  push:
    tags:
      - 'v*'

# V2.7: Minimal workflow permissions
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit-and-release:
    runs-on: ubuntu-latest
    steps:
      # V2.7: Hardened SHA Pinning for all Actions
      - name: Checkout Code
        # actions/checkout@v4.1.7
        uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332
        with:
          fetch-depth: 0

      - name: Setup Rust
        # dtolnay/rust-toolchain@stable
        uses: dtolnay/rust-toolchain@71d3df8f9b90875e5108f9216196a6669966d5f7
        with:
          toolchain: stable

      - name: Dogfooding Audit
        run: |
          echo "[Audit] Building τ-Gate for self-audit..."
          cargo build --release
          
          echo "[Audit] Running active spectral bisection on own tree..."
          # v1.1.0: Active Dogfooding. Fails build if our own tree is anomalous.
          ./target/release/tau-gate
          
          echo "✅ Dogfooding Audit Passed. Project is secured by itself."

      - name: Create Release
        # softprops/action-gh-release@v2.0.8
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8ad5bc06adad52
        with:
          files: target/release/tau-gate
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: contains(github.ref, '-pre')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
