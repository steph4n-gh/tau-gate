name: Release & Dogfood

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  audit-and-release:
    runs-on: ubuntu-latest
    steps:
      # Checkout with the Actions token in an extraheader, not the remote URL.
      # A push of a tag matching v* runs this job and publishes a GitHub Release.
      - name: Manual Checkout
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git remote add origin "https://github.com/${{ github.repository }}.git"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" fetch --depth 1 origin "${{ github.sha }}"
          git checkout FETCH_HEAD


      - name: Setup Rust Environment
        run: |
          # Use pre-installed rustup to ensure correct toolchain
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy

      - name: Build and validate qualified review
        run: |
          cargo build --release --offline
          cargo test --release --offline --all-targets
          ./e2e_zero.sh

      - name: Manual Release via GH CLI
        run: |
          echo "[Release] Creating or Updating GitHub Release using native CLI..."
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists. Uploading artifact..."
            gh release upload ${{ github.ref_name }} target/release/tau-gate --clobber
          else
            gh release create ${{ github.ref_name }} \
              target/release/tau-gate \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes \
              $( [[ "${{ github.ref_name }}" == *"-pre"* ]] && echo "--prerelease" )
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
