name: Release & Dogfood

on:
  push:
    tags:
      - 'v*'

jobs:
  audit-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dogfooding Audit
        run: |
          # Build tau-gate from source
          cargo build --release
          
          # Use the freshly built binary to audit its own dependencies!
          # v1.1.0: Active Dogfooding enabled. If our own dependencies are compromised, the build fails here.
          ./target/release/tau-gate
          
          echo "✅ Dogfooding Audit Passed. Project is secured by itself."

      - name: Build Final Binary
        run: cargo build --release

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/release/tau-gate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
