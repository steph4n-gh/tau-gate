name: Release & Dogfood

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  audit-and-release:
    runs-on: ubuntu-latest
    steps:
      # V2.0: Absolute Zero CI - Use only pre-installed runner tools
      - name: Manual Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} .
          git checkout ${{ github.sha }}

      - name: Setup Rust Environment
        run: |
          # Use pre-installed rustup to ensure correct toolchain
          rustup toolchain install stable
          rustup default stable

      - name: Dogfooding Audit
        run: |
          echo "[Audit] Building τ-Gate for self-audit..."
          cargo build --release
          
          echo "[Audit] Running active spectral bisection on own tree..."
          # Active Dogfooding: The zero-dependency binary audits itself.
          ./target/release/tau-gate
          
          echo "✅ Dogfooding Audit Passed. Project is secured by itself."

      - name: Manual Release via GH CLI
        run: |
          echo "[Release] Creating or Updating GitHub Release using native CLI..."
          if gh release view ${{ github.ref_name }} > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists. Uploading artifact..."
            gh release upload ${{ github.ref_name }} target/release/tau-gate --clobber
          else
            gh release create ${{ github.ref_name }} \
              target/release/tau-gate \
              --title "Release ${{ github.ref_name }}" \
              --generate-notes \
              $( [[ "${{ github.ref_name }}" == *"-pre"* ]] && echo "--prerelease" )
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
