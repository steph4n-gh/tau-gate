name: Release & Dogfood

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dogfooding Audit
        run: |
          echo "[Audit] Building τ-Gate for self-audit..."
          cargo build --release
          
          echo "[Audit] Running active spectral bisection on own tree..."
          # v1.1.0: Active Dogfooding. Fails build if our own tree is anomalous.
          ./target/release/tau-gate
          
          echo "✅ Dogfooding Audit Passed. Project is secured by itself."

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/tau-gate
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: contains(github.ref, '-pre')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
