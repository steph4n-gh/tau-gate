name: Release & Dogfood

on:
  push:
    tags:
      - 'v*'

# V2.0: Minimal workflow permissions
permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit-and-release:
    runs-on: ubuntu-latest
    steps:
      # V2.0: Hardened SHA Pinning for all Actions
      - name: Checkout Code
        # actions/checkout@v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Setup Rust
        # dtolnay/rust-toolchain@master
        uses: dtolnay/rust-toolchain@e97e2d8c103f57f044c693c79b74447c88e1d199
        with:
          toolchain: stable

      - name: Dogfooding Audit
        run: |
          echo "[Audit] Building τ-Gate for self-audit..."
          cargo build --release
          
          echo "[Audit] Running active spectral bisection on own tree..."
          # v2.0.0: Active Dogfooding. Fails build if our own tree is anomalous.
          ./target/release/tau-gate
          
          echo "✅ Dogfooding Audit Passed. Project is secured by itself."

      - name: Create Release
        # softprops/action-gh-release@v2.6.2
        uses: softprops/action-gh-release@3bb12730750646edd6202f5551a95399d7c344c6
        with:
          files: target/release/tau-gate
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: contains(github.ref, '-pre')
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
