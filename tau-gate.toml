# Tau-Gate Configuration

# The structural median anomaly threshold. If the partition holding suspicious
# packages drops below this % of the total graph size, the execution is blocked.
threshold_percentage = 15.0

# Whitelist trusted scopes or packages using Glob patterns.
# Legitimate packages that need to run install scripts but are small/isolated should go here.
whitelist = ["@astrojs/*", "@types/*", "vite"]
