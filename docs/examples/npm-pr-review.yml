name: Review npm execution evidence

on:
  pull_request_target:
    branches: [main]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  review:
    if: github.event_name == 'pull_request_target'
    name: tau-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
      HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      TAU_GATE_ARCHIVE_URL: ${{ vars.TAU_GATE_ARCHIVE_URL }}
      TAU_GATE_ARCHIVE_SHA256: ${{ vars.TAU_GATE_ARCHIVE_SHA256 }}
    steps:
      - name: Capture trusted base tools and both Git revisions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$HEAD_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          repository="$RUNNER_TEMP/npm-review-repository"
          git init "$repository"
          git -C "$repository" remote add origin "$GITHUB_SERVER_URL/$REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C "$repository" -c http.extraheader="AUTHORIZATION: basic $auth" fetch --depth 1 origin "$BASE_COMMIT" "$HEAD_COMMIT"
          git -C "$repository" -c core.hooksPath=/dev/null checkout --detach "$BASE_COMMIT"

      - name: Verify and install the trusted checker archive
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAU_GATE_ARCHIVE_URL" == https://* ]]
          [[ "$TAU_GATE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/tau-gate.tar.gz"
          install_dir="$RUNNER_TEMP/tau-gate-install"
          mkdir "$install_dir"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "$TAU_GATE_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$TAU_GATE_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$install_dir" --no-same-owner --no-same-permissions \
            ./tau-gate ./tools/pr_review.py ./tools/npm_evidence.py ./tools/github_pr_approval.py
          chmod +x "$install_dir/tau-gate"

      - name: Review exact snapshots and trusted maintainer comments
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repository="$RUNNER_TEMP/npm-review-repository"
          trusted="$RUNNER_TEMP/tau-gate-install"
          store="$RUNNER_TEMP/tau-gate-approvals"
          pre="$RUNNER_TEMP/npm-review-pre"
          output="$RUNNER_TEMP/npm-review-report"
          install -d -m 0700 "$store"
          if PYTHONDONTWRITEBYTECODE=1 python3 "$trusted/tools/pr_review.py" \
            --repo "$repository" \
            --base "$BASE_COMMIT" \
            --head "$HEAD_COMMIT" \
            --baseline-from-base \
            --tau-gate "$trusted/tau-gate" \
            --approval-store "$store" \
            --output "$pre" > "$RUNNER_TEMP/npm-review-pre.json"; then
            result=0
          else
            result=$?
          fi
          if [ "$result" -eq 1 ] && python3 -c 'import json,sys; sys.exit(0 if json.load(open(sys.argv[1])).get("approval_request") else 1)' "$pre/report.json"; then
            if PYTHONDONTWRITEBYTECODE=1 python3 "$trusted/tools/github_pr_approval.py" check \
              --report "$pre/report.json" --repository "$REPOSITORY" --pr-number "$PR_NUMBER"; then
              lookup=0
            else
              lookup=$?
            fi
            if [ "$lookup" -eq 0 ]; then
              subject=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["approval_request"]["subject_sha256"])' "$pre/report.json")
              if PYTHONDONTWRITEBYTECODE=1 python3 "$trusted/tools/pr_review.py" \
                --repo "$repository" --base "$BASE_COMMIT" --head "$HEAD_COMMIT" \
                --baseline-from-base --tau-gate "$trusted/tau-gate" --approval-store "$store" \
                --approve-subject "$subject" --output "$RUNNER_TEMP/npm-review-approval" \
                > "$RUNNER_TEMP/npm-review-approval.json"; then
                recorded=0
              else
                recorded=$?
              fi
              if [ "$recorded" -eq 0 ]; then
                if PYTHONDONTWRITEBYTECODE=1 python3 "$trusted/tools/pr_review.py" \
                  --repo "$repository" --base "$BASE_COMMIT" --head "$HEAD_COMMIT" \
                  --baseline-from-base --tau-gate "$trusted/tau-gate" --approval-store "$store" \
                  --output "$output" > "$RUNNER_TEMP/npm-review.json"; then
                  result=0
                else
                  result=$?
                fi
              else
                result=2
              fi
            elif [ "$lookup" -eq 2 ]; then
              result=2
              echo 'Trusted approval lookup failed; this check is incomplete.' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [ ! -d "$output" ] && [ -d "$pre" ]; then
            mv "$pre" "$output"
          fi
          if [ -f "$output/summary.md" ]; then
            cat "$output/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            cat "$RUNNER_TEMP/npm-review-pre.json"
          fi
          exit "$result"

      - name: Preserve review reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-review
          path: |
            ${{ runner.temp }}/npm-review-report/report.json
            ${{ runner.temp }}/npm-review-report/summary.md
          retention-days: 7
          if-no-files-found: warn

  rerun:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
    env:
      TAU_GATE_ARCHIVE_URL: ${{ vars.TAU_GATE_ARCHIVE_URL }}
      TAU_GATE_ARCHIVE_SHA256: ${{ vars.TAU_GATE_ARCHIVE_SHA256 }}
    steps:
      - name: Verify and run the trusted approval helper
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAU_GATE_ARCHIVE_URL" == https://* ]]
          [[ "$TAU_GATE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          archive="$RUNNER_TEMP/tau-gate.tar.gz"
          trusted="$RUNNER_TEMP/tau-gate-install"
          mkdir "$trusted"
          curl --fail --location --proto '=https' --proto-redir '=https' --tlsv1.2 "$TAU_GATE_ARCHIVE_URL" --output "$archive"
          printf '%s  %s\n' "$TAU_GATE_ARCHIVE_SHA256" "$archive" | sha256sum --check -
          tar --extract --gzip --file "$archive" --directory "$trusted" --no-same-owner --no-same-permissions \
            ./tools/github_pr_approval.py
          PYTHONDONTWRITEBYTECODE=1 python3 "$trusted/tools/github_pr_approval.py" rerun \
            --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY"
